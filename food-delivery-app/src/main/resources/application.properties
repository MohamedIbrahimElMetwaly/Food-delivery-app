spring.application.name=food-delivery-app

# ----- Datasource (override via env vars in each environment) -----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/food_delivery}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ----- SQL init -----
# Runs food_delivery.sql on startup for local/dev. Swap to Flyway before prod.
# By default Spring Boot runs script-based init BEFORE JPA initialises, which is
# what we want here: the script creates the tables, then ddl-auto=validate checks
# them. Do NOT set spring.jpa.defer-datasource-initialization=true — that would
# flip the order and cause validate to fail against an empty schema.
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:food_delivery.sql

# ----- springdoc / OpenAPI -----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
